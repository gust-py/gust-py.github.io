<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangar 3D — Visualizador .Build (Modal)</title>
<style>
  :root{
    --bg0:#0b1016; --panel:rgba(13,20,29,.88); --line:rgba(120,180,255,.14);
    --txt:#cfe3ff; --dim:#7d93ad; --acc:#4fc3f7; --acc2:#ffb74d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--txt)}
  
  /* Estrutura do Modal */
  .modal{position:fixed;inset:0;background:rgba(5,8,12,0.85);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px)}
  .modal-content{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:90%;max-width:800px;box-shadow:0 12px 40px rgba(0,0,0,0.6);position:relative}
  .close-modal{position:absolute;top:15px;right:20px;font-size:20px;cursor:pointer;color:var(--dim);transition:.2s}
  .close-modal:hover{color:#fff}
  .modal-content h2{font-size:16px;color:#fff;margin-bottom:15px;font-family:Consolas,monospace}
  
  .modal-3d-container{position:relative;width:100%;height:400px;background:#06090e;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .modal-3d-container canvas{display:block;width:100%!important;height:100%!important}
  
  .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(16,26,38,0.8);border:1px solid var(--line);color:var(--txt);padding:10px 14px;cursor:pointer;border-radius:6px;z-index:5;transition:.2s}
  .nav-arrow:hover{background:var(--acc);color:#06202e}
  .nav-arrow.left{left:10px}
  .nav-arrow.right{right:10px}

  #modal3DLoading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,16,22,0.9);z-index:10;color:var(--acc);font-family:Consolas,monospace;font-size:13px}
  
  .panel-control{margin-top:15px;display:flex;gap:10px;align-items:center;justify-content:space-between}
  button{background:#16222f;border:1px solid var(--line);color:var(--txt);font-size:11.5px;
    padding:6px 12px;border-radius:7px;cursor:pointer;transition:.15s;font-family:inherit}
  button:hover{border-color:var(--acc);color:#fff;background:#1b2b3c}
  button.on{background:var(--acc);border-color:var(--acc);color:#06202e;font-weight:700}
</style>
<!-- Bibliotecas Three.js via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<!-- Modal estruturado -->
<div id="buildModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" id="closeModal">&times;</span>
    <h2 id="modalTitle">Visualizador 3D — BuilderHub</h2>
    
    <div id="modal3D" class="modal-3d-container">
      <button id="modalPrevBtn" class="nav-arrow left">&#10094;</button>
      <button id="modalNextBtn" class="nav-arrow right">&#10095;</button>
      <div id="modal3DLoading">A carregar modelo 3D...</div>
      <img src="" id="modalTempImg" style="width: 100%; height: 100%; object-fit: contain; opacity: 0.3; position: absolute; top: 0px; left: 0px; display: none;">
      <canvas id="modalCanvas"></canvas>
    </div>

    <div class="panel-control">
      <div>
        <input type="file" id="fileInput" accept=".build,.json,.txt" style="display:none">
        <button id="btnOpen">Carregar Ficheiro .Build</button>
      </div>
      <div>
        <button id="btnGhost">Fantasma</button>
        <button id="btnGrid" class="on">Grade</button>
        <button id="btnAxes">Cotas</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
let renderer, scene, camera, controls, grid, axesGrp;
let meshes = [];    
let currentModel = 0, ghost = false, showGrid = true;

const canvas = document.getElementById('modalCanvas');
renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;

scene = new THREE.Scene();
scene.background = new THREE.Color(0x06090e);
scene.fog = new THREE.Fog(0x06090e, 900, 2400);

camera = new THREE.PerspectiveCamera(50, 1, 0.5, 6000);
controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;

// Luzes
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x2a3440, 0.95); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 1.25); sun.position.set(180, 320, 140); scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35); fill.position.set(-200, 120, -160); scene.add(fill);

// Grade
grid = new THREE.GridHelper(1200, 60, 0x2a4a6a, 0x16283a);
grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);

axesGrp = new THREE.Group(); scene.add(axesGrp);
(function makeAxes(){
  const len = 60, mk = (a,b,col)=>{
    const g = new THREE.BufferGeometry().setFromPoints([a,b]);
    return new THREE.Line(g, new THREE.LineBasicMaterial({color:col}));
  };
  axesGrp.add(mk(new THREE.Vector3(0,0,0), new THREE.Vector3(len,0,0), 0xff5577));
  axesGrp.add(mk(new THREE.Vector3(0,0,0), new THREE.Vector3(0,len,0), 0x77ff99));
  axesGrp.add(mk(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,len), 0x5599ff));
})();
axesGrp.visible = false;

function b64ToF32(b64){
  if (!b64) return new Float32Array(0);
  try {
    const bin = atob(b64), n = bin.length/4;
    const u8 = new Uint8Array(n*4);
    for(let i=0;i<n*4;i++) u8[i] = bin.charCodeAt(i);
    return new Float32Array(u8.buffer);
  } catch(err) {
    console.error("Erro ao descodificar Base64:", err);
    return new Float32Array(0);
  }
}

function clearMeshes(){
  meshes.forEach(o => scene.remove(o.mesh));
  meshes = [];
}

function buildMeshes(){
  clearMeshes();
  const data = window.__DATA__;
  if (!data || !data.models) return;
  
  const unit = new THREE.BoxGeometry(1,1,1);
  data.models.forEach((m, mi)=>{
    const pos = b64ToF32(m.pos), 
          siz = b64ToF32(m.siz), 
          col = b64ToF32(m.col),
          qua = b64ToF32(m.qua), 
          tix = b64ToF32(m.typeIdx);

    // vertexColors: true é obrigatório para pintar os blocos individualmente no InstancedMesh
    const mat = new THREE.MeshStandardMaterial({roughness:.82, metalness:.18, vertexColors: true});
    const mesh = new THREE.InstancedMesh(unit, mat, m.n);
    mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    
    const M = new THREE.Matrix4(), Q = new THREE.Quaternion(),
          P = new THREE.Vector3(), S = new THREE.Vector3(), C = new THREE.Color();
          
    for(let i=0; i<m.n; i++){
      P.set(pos[3*i] || 0, pos[3*i+1] || 0, pos[3*i+2] || 0);
      S.set(Math.max(siz[3*i] || 1, .01), Math.max(siz[3*i+1] || 1, .01), Math.max(siz[3*i+2] || 1, .01));
      Q.set(qua[4*i] || 0, qua[4*i+1] || 0, qua[4*i+2] || 0, qua[4*i+3] || 1);
      M.compose(P,Q,S); 
      mesh.setMatrixAt(i,M);
      
      if(col.length >= 3*(i+1)) {
        C.setRGB(col[3*i], col[3*i+1], col[3*i+2]);
      } else {
        C.set(0xffffff);
      }
      mesh.setColorAt(i,C);
    }
    mesh.instanceMatrix.needsUpdate = true;
    if(mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.visible = (mi === currentModel);
    scene.add(mesh);
    meshes.push({mesh, model:m, tix});
  });
}

function fitCamera(){
  if(!meshes[currentModel]) return;
  const m = meshes[currentModel].model;
  const b = m.bbox || {x:[-50,50], y:[0,100], z:[-50,50]};
  const cx=((b.x[0]||0)+(b.x[1]||0))/2, cy=((b.y[0]||0)+(b.y[1]||0))/2, cz=((b.z[0]||0)+(b.z[1]||0))/2;
  const S=((b.x[1]||0)-(b.x[0]||0)), L=((b.z[1]||0)-(b.z[0]||0)), H=((b.y[1]||0)-(b.y[0]||0));
  const R = Math.max(Math.abs(S), Math.abs(L), Math.abs(H), 50);
  controls.target.set(cx, cy, cz);
  camera.position.set(cx + R*1.15, cy + R*.62, cz + R*1.15);
  controls.update();
}

function setModel(i){
  if(meshes.length === 0) return;
  currentModel = (i + meshes.length) % meshes.length;
  meshes.forEach((o,idx)=>{
    o.mesh.visible = (idx === currentModel);
  });
  fitCamera();
  const activeModel = meshes[currentModel].model;
  if(activeModel && activeModel.name) {
    document.getElementById('modalTitle').textContent = activeModel.name;
  }
}

// Leitor robusto que ignora markdown do Discord e formatações de chat
function loadJSONData(text) {
  try {
    if (typeof text === 'string') {
      text = text.replace(/^```[a-zA-Z]*\n?/gm, '').replace(/```$/gm, '').trim();
      let firstBrace = text.indexOf('{');
      let lastBrace = text.lastIndexOf('}');
      if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
        text = text.substring(firstBrace, lastBrace + 1);
      }
      text = JSON.parse(text);
    }

    let json = text;
    if(!json.models && json.n && json.pos) {
      json = { models: [json] };
    }
    window.__DATA__ = json;
    currentModel = 0;
    buildMeshes();
    setModel(0);
    
    const loaderEl = document.getElementById('modal3DLoading');
    if(loaderEl) loaderEl.style.display = 'none';
  } catch(err) {
    console.error('Erro ao processar dados:', err);
    const loaderEl = document.getElementById('modal3DLoading');
    if(loaderEl) loaderEl.textContent = 'Erro ao carregar modelo 3D.';
  }
}

// Funções globais para ligar ao teu script principal
window.loadBuildData = loadJSONData;
window.triggerModalResize = function() {
  resize();
  if (meshes.length > 0) {
    fitCamera();
  }
};

// Eventos de navegação e UI
document.getElementById('modalPrevBtn').onclick = () => setModel(currentModel - 1);
document.getElementById('modalNextBtn').onclick = () => setModel(currentModel + 1);
document.getElementById('closeModal').onclick = () => {
  document.getElementById('buildModal').style.display = 'none';
};

document.getElementById('btnOpen').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => loadJSONData(evt.target.result);
  reader.readAsText(file);
};

const bG=document.getElementById('btnGhost'), bGr=document.getElementById('btnGrid'), bA=document.getElementById('btnAxes');
bGr.onclick=()=>{ showGrid=!showGrid; grid.visible=showGrid; bGr.classList.toggle('on',showGrid); };
bA.onclick=()=>{ axesGrp.visible=!axesGrp.visible; bA.classList.toggle('on',axesGrp.visible); };

function resize(){
  const container = document.getElementById('modal3D');
  if(!container) return;
  const w = container.clientWidth || 719;
  const h = container.clientHeight || 300;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}

// Inicialização
window.__DATA__ = { models: [] };
resize();
loop();
})();
</script>
</body>
</html>
