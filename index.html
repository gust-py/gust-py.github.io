<html lang="en">

<head>
	<title>KSP-Like Planet Demo | 5000km Planet</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<meta property="og:title" content="KSP-Like Planet Demo">
	<meta property="og:type" content="website">
	<link type="text/css" rel="stylesheet" href="main.css">
	<style>
		body {
			margin: 0;
			background-color: #000000;
			color: #ffffff;
			font-family: Monospace;
			font-size: 13px;
			line-height: 24px;
			overscroll-behavior: none;
			overflow: hidden;
		}

		a {
			color: #ff0;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		#info {
			position: absolute;
			top: 0px;
			width: 100%;
			padding: 10px;
			box-sizing: border-box;
			text-align: center;
			-moz-user-select: none;
			-webkit-user-select: none;
			-ms-user-select: none;
			user-select: none;
			pointer-events: none;
			z-index: 1;
			text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
		}

		a,
		button,
		input,
		select {
			pointer-events: auto;
		}

		#container {
			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body>
	<div id="info">
		<b>PLANET DEMO - 5000 KM RADIUS</b><br />
		OrbitControls | Ammo.js Physics | Starfield + Atmosphere
	</div>
	<div id="container"></div>

	<script src="https://cdn.jsdelivr.net/gh/kripken/ammo.js@79190a1f03845794b1bba1777f30037349967658/builds/ammo.wasm.js"></script>

	<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
				}
			}
		</script>

	<script type="module">

		import * as THREE from 'three';

		import Stats from 'three/addons/libs/stats.module.js';

		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

		// Graphics variables
		let container, stats;
		let camera, controls, scene, renderer;
		let textureLoader;

		const timer = new THREE.Timer();
		timer.connect(document);

		// Physics variables
		const gravityConstant = -9.80665;
		let physicsWorld;
		const rigidBodies = [];
		const margin = 0.05;
		let transformAux1;

		// Planet variables
		const PLANET_RADIUS_KM = 5000;
		const PLANET_RADIUS = PLANET_RADIUS_KM; // Using 1 unit = 1 km for scale
		const ATMOSPHERE_RADIUS = PLANET_RADIUS * 1.015;
		const ATMOSPHERE_GLOW_RADIUS = PLANET_RADIUS * 1.025;

		Ammo().then(function (AmmoLib) {

			Ammo = AmmoLib;

			init();

		});

		function init() {

			initGraphics();

			initPhysics();

			createCelestialBodies();

			initInput();

		}

		function initGraphics() {

			container = document.getElementById('container');

			camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, PLANET_RADIUS * 100);
			camera.position.set(PLANET_RADIUS * 1.8, PLANET_RADIUS * 0.6, PLANET_RADIUS * 1.8);

			scene = new THREE.Scene();
			scene.background = new THREE.Color(0x000000);

			renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setAnimationLoop(animate);
			renderer.shadowMap.enabled = true;
			renderer.shadowMap.type = THREE.PCFSoftShadowMap;
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.toneMappingExposure = 1.2;
			container.appendChild(renderer.domElement);

			controls = new OrbitControls(camera, renderer.domElement);
			controls.target.set(0, 0, 0);
			controls.enableDamping = true;
			controls.dampingFactor = 0.05;
			controls.minDistance = PLANET_RADIUS * 1.01;
			controls.maxDistance = PLANET_RADIUS * 15;
			controls.update();

			textureLoader = new THREE.TextureLoader();

			// Sun light (Directional Light)
			const sunLight = new THREE.DirectionalLight(0xfff3e0, 4.5);
			sunLight.position.set(PLANET_RADIUS * 50, PLANET_RADIUS * 20, PLANET_RADIUS * 30);
			sunLight.castShadow = true;

			const sunShadowSize = PLANET_RADIUS * 2;
			sunLight.shadow.camera.left = -sunShadowSize;
			sunLight.shadow.camera.right = sunShadowSize;
			sunLight.shadow.camera.top = sunShadowSize;
			sunLight.shadow.camera.bottom = -sunShadowSize;
			sunLight.shadow.camera.near = 1;
			sunLight.shadow.camera.far = PLANET_RADIUS * 60;

			sunLight.shadow.mapSize.width = 2048;
			sunLight.shadow.mapSize.height = 2048;
			sunLight.shadow.bias = -0.00005;

			scene.add(sunLight);

			// Soft ambient light for distant shadows
			const hemiLight = new THREE.HemisphereLight(0x7c9dff, 0x4a3728, 0.4);
			scene.add(hemiLight);

			// Stats
			stats = new Stats();
			stats.domElement.style.position = 'absolute';
			stats.domElement.style.top = '0px';
			stats.domElement.style.left = '0px';
			container.appendChild(stats.domElement);

			window.addEventListener('resize', onWindowResize);

		}

		function initPhysics() {

			// Physics configuration
			const collisionConfiguration = new Ammo.btDefaultCollisionConfiguration();
			const dispatcher = new Ammo.btCollisionDispatcher(collisionConfiguration);
			const broadphase = new Ammo.btDbvtBroadphase();
			const solver = new Ammo.btSequentialImpulseConstraintSolver();
			physicsWorld = new Ammo.btDiscreteDynamicsWorld(dispatcher, broadphase, solver, collisionConfiguration);
			physicsWorld.setGravity(new Ammo.btVector3(0, gravityConstant, 0));

			transformAux1 = new Ammo.btTransform();

		}

		function createCelestialBodies() {

			createStarfield();
			createPlanet();
			createAtmosphere();
			createAtmosphereGlow();

		}

		function createStarfield() {

			const starGeometry = new THREE.BufferGeometry();
			const starCount = 15000;
			const positions = new Float32Array(starCount * 3);
			const colors = new Float32Array(starCount * 3);

			for (let i = 0; i < starCount; i++) {

				const i3 = i * 3;

				// Distribute stars in a large sphere around the scene
				const radius = PLANET_RADIUS * 80 + Math.random() * PLANET_RADIUS * 40;
				const theta = Math.random() * Math.PI * 2;
				const phi = Math.acos((Math.random() * 2) - 1);

				positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
				positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
				positions[i3 + 2] = radius * Math.cos(phi);

				// Vary star color slightly
				const starColor = new THREE.Color();
				const colorChoice = Math.random();

				if (colorChoice < 0.7) {
					// White/blueish stars
					starColor.setHSL(0.6, Math.random() * 0.1, 0.8 + Math.random() * 0.2);
				} else if (colorChoice < 0.9) {
					// Yellow/orange stars
					starColor.setHSL(0.1, Math.random() * 0.2, 0.7 + Math.random() * 0.2);
				} else {
					// Red stars
					starColor.setHSL(0.0, Math.random() * 0.3, 0.6 + Math.random() * 0.2);
				}

				colors[i3] = starColor.r;
				colors[i3 + 1] = starColor.g;
				colors[i3 + 2] = starColor.b;

			}

			starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
			starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

			const starMaterial = new THREE.PointsMaterial({
				size: 2,
				sizeAttenuation: true,
				vertexColors: true,
				transparent: true,
				opacity: 0.9
			});

			const stars = new THREE.Points(starGeometry, starMaterial);
			scene.add(stars);

		}

		function createPlanet() {

			const planetGeometry = new THREE.SphereGeometry(PLANET_RADIUS, 128, 64);

			// Create a simple procedural-like material
			const planetMaterial = new THREE.MeshPhongMaterial({
				color: 0x3a5f0b,
				shininess: 10,
				specular: 0x111111
			});

			// Add some variation with vertex colors for continents/oceans
			const positions = planetGeometry.attributes.position;
			const colors = new Float32Array(positions.count * 3);

			for (let i = 0; i < positions.count; i++) {

				const x = positions.getX(i);
				const y = positions.getY(i);
				const z = positions.getZ(i);

				const normal = new THREE.Vector3(x, y, z).normalize();

				// Simple noise-like distribution
				const noise = (Math.sin(normal.x * 12.9898 + normal.y * 78.233) * 43758.5453) % 1;
				const noise2 = (Math.sin(normal.y * 39.346 + normal.z * 11.135) * 37614.3254) % 1;
				const combinedNoise = Math.abs(noise + noise2) / 2;

				const color = new THREE.Color();

				if (combinedNoise > 0.65) {
					// Land
					if (combinedNoise > 0.8) {
						// Mountains/desert highlands
						color.setHex(0x6b5d3b);
					} else if (combinedNoise > 0.72) {
						// Grasslands/forests
						color.setHex(0x4a5d23);
					} else {
						// Plains
						color.setHex(0x3a5f0b);
					}
				} else {
					// Oceans
					if (combinedNoise > 0.4) {
						// Shallow water
						color.setHex(0x1a4d6b);
					} else {
						// Deep ocean
						color.setHex(0x0a2f4d);
					}
				}

				colors[i * 3] = color.r;
				colors[i * 3 + 1] = color.g;
				colors[i * 3 + 2] = color.b;

			}

			planetGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
			planetMaterial.vertexColors = true;

			const planet = new THREE.Mesh(planetGeometry, planetMaterial);
			planet.receiveShadow = true;
			planet.castShadow = true;
			scene.add(planet);

			// Add physics body for the planet (static)
			const planetShape = new Ammo.btSphereShape(PLANET_RADIUS);
			planetShape.setMargin(margin);

			const planetPos = new THREE.Vector3(0, 0, 0);
			const planetQuat = new THREE.Quaternion(0, 0, 0, 1);

			const transform = new Ammo.btTransform();
			transform.setIdentity();
			transform.setOrigin(new Ammo.btVector3(planetPos.x, planetPos.y, planetPos.z));
			transform.setRotation(new Ammo.btQuaternion(planetQuat.x, planetQuat.y, planetQuat.z, planetQuat.w));

			const motionState = new Ammo.btDefaultMotionState(transform);
			const localInertia = new Ammo.btVector3(0, 0, 0);
			const rbInfo = new Ammo.btRigidBodyConstructionInfo(0, motionState, planetShape, localInertia);
			const planetBody = new Ammo.btRigidBody(rbInfo);

			planet.userData.physicsBody = planetBody;
			physicsWorld.addRigidBody(planetBody);
			rigidBodies.push(planet);

		}

		function createAtmosphere() {

			const atmosphereGeometry = new THREE.SphereGeometry(ATMOSPHERE_RADIUS, 64, 32);

			const atmosphereMaterial = new THREE.ShaderMaterial({
				uniforms: {
					c: { value: 0.8 },
					p: { value: 4.5 },
					glowColor: { value: new THREE.Color(0x7bb3ff) },
					viewVector: { value: camera.position }
				},
				vertexShader: `
					uniform vec3 viewVector;
					uniform float c;
					uniform float p;
					varying float intensity;
					void main() {
						vec3 vNormal = normalize( normalMatrix * normal );
						vec3 vNormel = normalize( normalMatrix * viewVector );
						intensity = pow( c - dot(vNormal, vNormel), p );
						gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
					}
				`,
				fragmentShader: `
					uniform vec3 glowColor;
					varying float intensity;
					void main() {
						vec3 glow = glowColor * intensity;
						gl_FragColor = vec4( glow, 1.0 );
					}
				`,
				side: THREE.BackSide,
				blending: THREE.AdditiveBlending,
				transparent: true,
				depthWrite: false
			});

			const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
			atmosphere.userData.isAtmosphere = true;
			scene.add(atmosphere);

		}

		function createAtmosphereGlow() {

			const glowGeometry = new THREE.SphereGeometry(ATMOSPHERE_GLOW_RADIUS, 48, 24);

			const glowMaterial = new THREE.ShaderMaterial({
				uniforms: {
					c: { value: 0.4 },
					p: { value: 6.0 },
					glowColor: { value: new THREE.Color(0x9dc3ff) },
					viewVector: { value: camera.position }
				},
				vertexShader: `
					uniform vec3 viewVector;
					uniform float c;
					uniform float p;
					varying float intensity;
					void main() {
						vec3 vNormal = normalize( normalMatrix * normal );
						vec3 vNormel = normalize( normalMatrix * viewVector );
						intensity = pow( c - dot(vNormal, vNormel), p );
						gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
					}
				`,
				fragmentShader: `
					uniform vec3 glowColor;
					varying float intensity;
					void main() {
						vec3 glow = glowColor * intensity * 0.6;
						gl_FragColor = vec4( glow, glow.r * 0.8 );
					}
				`,
				side: THREE.BackSide,
				blending: THREE.AdditiveBlending,
				transparent: true,
				depthWrite: false
			});

			const atmosphereGlow = new THREE.Mesh(glowGeometry, glowMaterial);
			atmosphereGlow.userData.isAtmosphere = true;
			scene.add(atmosphereGlow);

		}

		function initInput() {

			// No click interactions yet - focusing on planet setup only

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(window.innerWidth, window.innerHeight);

		}

		function animate() {

			timer.update();

			render();
			stats.update();

		}

		function render() {

			const deltaTime = timer.getDelta();

			updatePhysics(deltaTime);

			// Update atmosphere shaders to face camera
			scene.traverse(function (object) {

				if (object.userData.isAtmosphere && object.material.uniforms && object.material.uniforms.viewVector) {
					object.material.uniforms.viewVector.value = new THREE.Vector3().subVectors(camera.position, object.position);
				}

			});

			renderer.render(scene, camera);

		}

		function updatePhysics(deltaTime) {

			// Step world
			physicsWorld.stepSimulation(deltaTime, 10);

			// Update rigid bodies
			for (let i = 0, il = rigidBodies.length; i < il; i++) {

				const objThree = rigidBodies[i];
				const objPhys = objThree.userData.physicsBody;
				const ms = objPhys.getMotionState();
				if (ms) {

					ms.getWorldTransform(transformAux1);
					const p = transformAux1.getOrigin();
					const q = transformAux1.getRotation();
					objThree.position.set(p.x(), p.y(), p.z());
					objThree.quaternion.set(q.x(), q.y(), q.z(), q.w());

				}

			}

		}

	</script>

</body>

</html>
