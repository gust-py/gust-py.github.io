<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangar 3D — C-5 → C-17</title>
<style>
  :root{
    --bg0:#0b1016; --bg1:#111a24; --panel:rgba(13,20,29,.88); --line:rgba(120,180,255,.14);
    --txt:#cfe3ff; --dim:#7d93ad; --acc:#4fc3f7; --acc2:#ffb74d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--txt)}
  #c{position:fixed;inset:0;display:block}
  .panel{position:fixed;top:14px;left:14px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;backdrop-filter:blur(10px);max-width:300px;
    box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .panel h1{font-size:15px;letter-spacing:.5px;margin-bottom:2px;color:#fff}
  .panel h1 span{color:var(--acc)}
  .sub{font-size:11px;color:var(--dim);margin-bottom:10px;font-family:Consolas,monospace}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin:10px 0 5px}
  .row{display:flex;flex-wrap:wrap;gap:5px}
  button{background:#16222f;border:1px solid var(--line);color:var(--txt);font-size:11.5px;
    padding:6px 10px;border-radius:7px;cursor:pointer;transition:.15s;font-family:inherit}
  button:hover{border-color:var(--acc);color:#fff;background:#1b2b3c}
  button.on{background:var(--acc);border-color:var(--acc);color:#06202e;font-weight:700}
  button.warn.on{background:var(--acc2);border-color:var(--acc2)}
  .info{margin-top:10px;font-size:11px;color:var(--dim);font-family:Consolas,monospace;line-height:1.6;
    border-top:1px solid var(--line);padding-top:8px}
  .info b{color:var(--acc);font-weight:600}
  #hint{position:fixed;bottom:12px;right:16px;font-size:10.5px;color:var(--dim);opacity:.8;
    font-family:Consolas,monospace}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg0);z-index:10;color:var(--acc);font-family:Consolas,monospace;font-size:13px}
  .bar{width:220px;height:3px;background:#1b2b3c;border-radius:2px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:var(--acc);border-radius:2px;
    animation:ld 1.1s ease-in-out infinite alternate}
  @keyframes ld{from{transform:translateX(-60%)}to{transform:translateX(240%)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div style="text-align:center">CARREGANDO HANGAR<div class="bar"><i></i></div></div></div>

<div class="panel">
  <h1>HANGAR <span>3D</span></h1>
  <div class="sub">BuilderHub · block-build viewer</div>

  <div class="lbl">Modelo</div>
  <div class="row" id="modelBtns"></div>

  <div class="lbl">Câmera</div>
  <div class="row">
    <button data-cam="q">¾ vista</button>
    <button data-cam="side">Perfil</button>
    <button data-cam="front">Frente</button>
    <button data-cam="top">Topo</button>
    <button data-cam="rear">Traseira</button>
  </div>

  <div class="lbl">Exibição</div>
  <div class="row">
    <button id="btnGhost">Fantasma</button>
    <button id="btnGrid" class="on">Grade</button>
    <button id="btnAxes">Cotas</button>
    <button id="btnPlat">Ocultar plat.</button>
  </div>
  <div class="lbl">Peças</div>
  <div class="row">
    <button id="btnParts">Colorir peças</button>
    <select id="selPart" style="background:#16222f;color:var(--txt);border:1px solid var(--line);
      border-radius:7px;font-size:11.5px;padding:5px"><option value="-1">— todas —</option></select>
  </div>

  <div class="info" id="info"></div>
</div>
<div id="hint">arrastar: orbitar · roda: zoom · botão direito: pan</div>

<script>__THREE__</script>
<script>__ORBIT__</script>
<script>
window.__DATA__ = __DATA__;

(function(){
"use strict";
const V = new THREE.Vector3();
let renderer, scene, camera, controls, grid, axesGrp;
const meshes = [];   // {mesh, model, visible}
let currentModel = 0, ghost = false, showGrid = true;

const canvas = document.getElementById('c');
renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;

scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1016);
scene.fog = new THREE.Fog(0x0b1016, 900, 2400);

camera = new THREE.PerspectiveCamera(50, 1, 0.5, 6000);
controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;

// Luzes
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x2a3440, 0.95); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 1.25); sun.position.set(180, 320, 140); scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35); fill.position.set(-200, 120, -160); scene.add(fill);

// Grid
grid = new THREE.GridHelper(1200, 60, 0x2a4a6a, 0x16283a);
grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);

axesGrp = new THREE.Group(); scene.add(axesGrp);
(function makeAxes(){
  const len = 60, mk = (a,b,col)=>{
    const g = new THREE.BufferGeometry().setFromPoints([a,b]);
    return new THREE.Line(g, new THREE.LineBasicMaterial({color:col}));
  };
  axesGrp.add(mk(new THREE.Vector3(0,0,0), new THREE.Vector3(len,0,0), 0xff5577)); // X
  axesGrp.add(mk(new THREE.Vector3(0,0,0), new THREE.Vector3(0,len,0), 0x77ff99)); // Y
  axesGrp.add(mk(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,len), 0x5599ff)); // Z
})();
axesGrp.visible = false;

function b64ToF32(b64){
  const bin = atob(b64), n = bin.length/4;
  const u8 = new Uint8Array(n*4);
  for(let i=0;i<n*4;i++) u8[i] = bin.charCodeAt(i);
  return new Float32Array(u8.buffer);
}

const PART_COLORS = [
  [0.62,0.66,0.72], // 0 fuselagem
  [0.30,0.55,0.95], // 1 asa E
  [0.30,0.55,0.95], // 2 asa D
  [0.95,0.45,0.30], // 3 deriva
  [1.00,0.75,0.25], // 4 estab H
  [0.35,0.90,0.45], // 5 motores
  [0.80,0.35,0.90], // 6 trem
  [0.95,0.85,0.30], // 7 display
  [0.60,0.60,0.60], // 8 obj ponta
  [0.90,0.90,0.95], // 9 plataforma
  [0.70,0.70,0.70], // 10 misc
];
let partsMode = false, soloPart = -1, hidePlat = false;

function applyPartColors(){
  meshes.forEach(o=>{
    const m = o.model;
    if(!o.prt) o.prt = b64ToF32(m.partIdx);
    const C = new THREE.Color();
    for(let i=0;i<m.n;i++){
      const p = o.prt[i];
      if(partsMode){
        const c = PART_COLORS[p] || [0.7,0.7,0.7];
        C.setRGB(c[0],c[1],c[2]);
      } else {
        C.setRGB(o.col0[3*i],o.col0[3*i+1],o.col0[3*i+2]);
      }
      o.mesh.setColorAt(i,C);
    }
    o.mesh.instanceColor.needsUpdate = true;
  });
}

function applyPlatVisibility(){
  meshes.forEach(o=>{
    if(!o.prt) o.prt = b64ToF32(o.model.partIdx);
    if(!hidePlat){ o.mesh.visible = (meshes.indexOf(o)===currentModel) || ghost; return; }
    if(meshes.indexOf(o)!==currentModel){ o.mesh.visible = ghost; return; }
    // reconstroi visibilidade por parte: usa count de instância não dá p/ ocultar seletivamente
    // -> usa mesh duplicada? Simplificação: zera escala via matrix é caro; usa groups por parte?
    o.mesh.visible = true;
  });
}

function applySolo(){
  meshes.forEach(o=>{
    if(!o.prt) o.prt = b64ToF32(o.model.partIdx);
    if(soloPart < 0 || currentModel !== meshes.indexOf(o)){
      applyVisibility(); return;
    }
  });
  // ghost: blocos de outras peças do modelo atual ficam translúcidos via cor escura
  applyPartColors();
}

function buildMeshes(){
  const data = window.__DATA__;
  const unit = new THREE.BoxGeometry(1,1,1);
  data.models.forEach((m, mi)=>{
    const pos=b64ToF32(m.pos), siz=b64ToF32(m.siz), col=b64ToF32(m.col),
          qua=b64ToF32(m.qua), tix=b64ToF32(m.typeIdx), prt=b64ToF32(m.partIdx);
    const geo = unit;
    const mat = new THREE.MeshStandardMaterial({roughness:.82, metalness:.18});
    const mesh = new THREE.InstancedMesh(geo, mat, m.n);
    mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    const M = new THREE.Matrix4(), Q = new THREE.Quaternion(),
          P = new THREE.Vector3(), S = new THREE.Vector3(), C = new THREE.Color();
    for(let i=0;i<m.n;i++){
      P.set(pos[3*i],pos[3*i+1],pos[3*i+2]);
      S.set(Math.max(siz[3*i],.01),Math.max(siz[3*i+1],.01),Math.max(siz[3*i+2],.01));
      Q.set(qua[4*i],qua[4*i+1],qua[4*i+2],qua[4*i+3]);
      M.compose(P,Q,S); mesh.setMatrixAt(i,M);
      C.setRGB(col[3*i],col[3*i+1],col[3*i+2]);
      mesh.setColorAt(i,C);
    }
    mesh.instanceMatrix.needsUpdate = true;
    if(mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.visible = (mi === currentModel);
    scene.add(mesh);
    meshes.push({mesh, model:m, tix, prt, col0:col.slice()});
  });
}

function fmt(n){ return n.toFixed(1); }
function updateInfo(){
  const m = meshes[currentModel].model;
  const b = m.bbox;
  const L = b.z[1]-b.z[0], S = b.x[1]-b.x[0], H = b.y[1]-b.y[0];
  document.getElementById('info').innerHTML =
    `<b>${m.name}</b><br>${m.n.toLocaleString('pt-BR')} blocos · ${m.types.length} tipos<br>` +
    `Compr (Z): ${fmt(L)} · Enverg (X): ${fmt(S)} · Alt (Y): ${fmt(H)}<br>` +
    `Z: [${fmt(b.z[0])}, ${fmt(b.z[1])}] · X: [${fmt(b.x[0])}, ${fmt(b.x[1])}] · Y: [${fmt(b.y[0])}, ${fmt(b.y[1])}]`;
}

function fitCamera(view){
  const m = meshes[currentModel].model;
  const b = m.fitbox || m.bbox;
  const cx=(b.x[0]+b.x[1])/2, cy=(b.y[0]+b.y[1])/2, cz=(b.z[0]+b.z[1])/2;
  const S=(b.x[1]-b.x[0]), L=(b.z[1]-b.z[0]), H=(b.y[1]-b.y[0]);
  const R = Math.max(S, L, H);
  controls.target.set(cx, cy, cz);
  let p;
  if(view==='side')       p=[cx + R*1.55, cy+R*.03, cz];
  else if(view==='front') p=[cx, cy+R*.08, cz + R*1.55];
  else if(view==='rear')  p=[cx, cy+R*.08, cz - R*1.55];
  else if(view==='top')   p=[cx, cy + R*1.6, cz+0.001];
  else                    p=[cx + R*1.15, cy + R*.62, cz + R*1.15]; // ¾
  camera.position.set(p[0],p[1],p[2]);
  controls.update();
}

function applyVisibility(){
  meshes.forEach((o,i)=>{
    if(i===currentModel) o.mesh.visible = true;
    else o.mesh.visible = ghost;
    if(o.mesh.material){
      o.mesh.material.transparent = (i!==currentModel) && ghost;
      o.mesh.material.opacity = (i!==currentModel) ? 0.10 : 1.0;
      o.mesh.material.depthWrite = (i===currentModel);
    }
  });
}

function setModel(i){
  currentModel = i;
  applyVisibility();
  document.querySelectorAll('#modelBtns button').forEach((b,bi)=>b.classList.toggle('on', bi===i));
  fitCamera('q'); updateInfo();
}

// UI
const data = window.__DATA__;
const mBtns = document.getElementById('modelBtns');
data.models.forEach((m,i)=>{
  const b = document.createElement('button');
  b.textContent = m.name; b.onclick = ()=>setModel(i);
  mBtns.appendChild(b);
});
document.querySelectorAll('[data-cam]').forEach(b=>{
  b.onclick = ()=>{ fitCamera(b.dataset.cam);
    document.querySelectorAll('[data-cam]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
});
const bG=document.getElementById('btnGhost'), bGr=document.getElementById('btnGrid'), bA=document.getElementById('btnAxes');
const bP=document.getElementById('btnParts'), selPart=document.getElementById('selPart');
const PART_NAMES_UI = window.__DATA__.models[0].partNames;
PART_NAMES_UI.forEach((nm,i)=>{
  const op=document.createElement('option'); op.value=i; op.textContent=nm; selPart.appendChild(op);
});
bP.onclick=()=>{ partsMode=!partsMode; bP.classList.toggle('on',partsMode); applyPartColors(); };
const bPlat=document.getElementById('btnPlat');
bPlat.onclick=()=>{ hidePlat=!hidePlat; bPlat.classList.toggle('on',hidePlat);
  meshes.forEach((o,idx)=>{
    if(idx!==currentModel) return;
    const m=o.model, M=new THREE.Matrix4(), Q=new THREE.Quaternion(), P=new THREE.Vector3(), S=new THREE.Vector3();
    const pos=b64ToF32(m.pos), siz=b64ToF32(m.siz), qua=b64ToF32(m.qua);
    for(let i=0;i<m.n;i++){
      const p=o.prt[i];
      const hidden = hidePlat && p===9;
      P.set(pos[3*i],pos[3*i+1],pos[3*i+2]);
      S.set(siz[3*i],siz[3*i+1],siz[3*i+2]);
      if(hidden) S.set(0.0001,0.0001,0.0001);
      Q.set(qua[4*i],qua[4*i+1],qua[4*i+2],qua[4*i+3]);
      M.compose(P,Q,S); o.mesh.setMatrixAt(i,M);
    }
    o.mesh.instanceMatrix.needsUpdate=true;
  });
};
selPart.onchange=()=>{
  soloPart = parseInt(selPart.value);
  meshes.forEach((o,idx)=>{
    if(idx!==currentModel) return;
    const m=o.model, C=new THREE.Color();
    for(let i=0;i<m.n;i++){
      const p=o.prt[i];
      if(partsMode && soloPart>=0){
        if(p===soloPart){ const c=PART_COLORS[p]||[0.7,0.7,0.7]; C.setRGB(c[0],c[1],c[2]); }
        else C.setRGB(0.13,0.15,0.18);
      }
      o.mesh.setColorAt(i,C);
    }
    o.mesh.instanceColor.needsUpdate=true;
  });
};
bG.onclick=()=>{ ghost=!ghost; bG.classList.toggle('on',ghost); applyVisibility(); };
bGr.onclick=()=>{ showGrid=!showGrid; grid.visible=showGrid; bGr.classList.toggle('on',showGrid); };
bA.onclick=()=>{ axesGrp.visible=!axesGrp.visible; bA.classList.toggle('on',axesGrp.visible); };

function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

let t0=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene,camera);
}

buildMeshes();
resize();
setModel(0);
document.getElementById('loading').style.display='none';
loop(t0);

// câmera inicial via hash (#q #side #front #top #rear | #cam=x,y,z,tx,ty,tz | #solo=N | #parts=1)
const h = (location.hash||'').replace('#','');
const params = new URLSearchParams(h.replace(/&/g,'&'));
if(params.has('model')){
  setModel(parseInt(params.get('model')));
}
if(params.has('cam')){
  const v = params.get('cam').split(',').map(Number);
  if(v.length>=6){ camera.position.set(v[0],v[1],v[2]); controls.target.set(v[3],v[4],v[5]); controls.update(); }
}else if(['q','side','front','top','rear'].includes(h.split('&')[0])){
  fitCamera(h.split('&')[0]);
}
if(params.has('solo')){
  partsMode = true; bP.classList.add('on'); applyPartColors();
  soloPart = parseInt(params.get('solo')); selPart.value = soloPart;
  selPart.dispatchEvent(new Event('change'));
}
if(params.has('plat')){ bPlat.click(); }
})();
</script>
</body>
</html>
