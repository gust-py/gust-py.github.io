<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuromorphic AI Testbench</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #161920;
            --accent: #00ff88;
            --text: #e0e6ed;
            --dim: #7a889b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid #222733;
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
            color: #fff;
        }

        p {
            color: var(--dim);
            margin: 0;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #222733;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--dim);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select, button {
            width: 100%;
            padding: 0.6rem;
            background: #0b0c0e;
            border: 1px solid #222733;
            color: var(--text);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 1rem;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .console {
            background: #0b0c0e;
            border: 1px solid #222733;
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            height: 200px;
            overflow-y: auto;
            color: var(--accent);
        }

        .log-entry {
            margin-bottom: 0.4rem;
            color: var(--text);
        }

        .log-entry span {
            color: var(--dim);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Neuromorphic AI Bench</h1>
        <p>Interface de teste para execução de redes de Spiking Neural Networks (SNN).</p>
    </header>

    <div class="grid">
        <div class="card">
            <label for="model">Modelo de Neurônio</label>
            <select id="model">
                <option value="lif">Leaky Integrate-and-Fire (LIF)</option>
                <option value="iznikevich">Izhikevich</option>
                <option value="hh">Hodgkin-Huxley</option>
            </select>

            <label for="threshold" style="margin-top: 1rem;">Limiar de Disparo (mV)</label>
            <input type="number" id="threshold" value="-55">
        </div>

        <div class="card">
            <label for="spikes">Frequência de Spikes (Hz)</label>
            <input type="number" id="spikes" value="120">

            <button onclick="runTest()">Executar Teste</button>
        </div>
    </div>

    <label>Logs de Saída de Pulsos</label>
    <div class="console" id="output">
        <div class="log-entry"><span>[00:00:00]</span> Sistema pronto. Aguardando inicialização...</div>
    </div>
</div>

<script>
    function runTest() {
        const consoleEl = document.getElementById('output');
        const model = document.getElementById('model').value;
        const threshold = document.getElementById('threshold').value;
        const spikes = document.getElementById('spikes').value;
        
        const time = new Date().toLocaleTimeString();
        
        const log = document.createElement('div');
        log.className = 'log-entry';
        log.innerHTML = `<span>[${time}]</span> Executando <b>${model.toUpperCase()}</b> | Threshold: ${threshold}mV | Taxa: ${spikes}Hz -> <span style="color: var(--accent)">Sucesso (2.4mW consumidos)</span>`;
        
        consoleEl.appendChild(log);
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }
</script>

</body>
</html>
