<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AI Chat</title>
    <style>
        :root {
            --bg-base: #131314;
            --bg-surface: #1e1f20;
            --bg-surface-hover: #2a2b2f;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent: #a8c7fa;
            --sidebar-width: 280px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-surface);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            transition: transform 0.3s ease, width 0.3s ease;
            border-right: 1px solid #333;
        }

        .sidebar.collapsed {
            width: 0;
            padding: 0;
            transform: translateX(-100%);
            border-right: none;
            overflow: hidden;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid #444;
            padding: 12px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-surface-hover);
        }

        .config-box {
            background-color: var(--bg-base);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .config-box label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .config-box input {
            background: var(--bg-surface);
            border: 1px solid #444;
            color: var(--text-primary);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .config-box input:focus {
            border-color: var(--accent);
        }

        .history-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            margin-top: 1rem;
        }

        /* --- Main Content --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn:hover {
            background-color: var(--bg-surface-hover);
        }

        .header-title {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* --- Chat Area --- */
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message {
            display: flex;
            gap: 1.5rem;
            max-width: 100%;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #000;
            font-weight: bold;
        }

        .message.user .avatar {
            background-color: #555;
            color: #fff;
        }

        .message-content {
            background-color: var(--bg-surface);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.6;
            max-width: 80%;
            word-break: break-word;
        }

        .message.user .message-content {
            background-color: #333;
        }

        /* --- Input Area --- */
        .input-wrapper {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .input-box {
            background-color: var(--bg-surface);
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border: 1px solid #444;
        }

        .input-box:focus-within {
            border-color: var(--accent);
            background-color: #232529;
        }

        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            padding: 12px 0;
            max-height: 150px;
            min-height: 48px;
            outline: none;
            overflow-y: hidden;
        }

        textarea::placeholder {
            color: #777;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .send-btn:hover {
            background-color: rgba(168, 199, 250, 0.1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Nova conversa
        </button>
        
        <div class="config-box">
            <label for="hf-token">Hugging Face Token</label>
            <input type="password" id="hf-token" placeholder="hf_..." />
            
            <label for="hf-model">Modelo (Endpoint)</label>
            <input type="text" id="hf-model" value="meta-llama/Llama-3.1-8B-Instruct" />
        </div>

        <ul class="history-list" id="history-list"></ul>
    </aside>

    <main class="main-content">
        <header>
            <button class="menu-btn" onclick="toggleSidebar()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <span class="header-title">Test AI</span>
        </header>

        <div class="chat-container" id="chat-container">
            <div class="message ai">
                <div class="avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                </div>
                <div class="message-content">
                    Olá! Insira seu token da Hugging Face na barra lateral para começar a conversar com o Llama.
                </div>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="user-input" rows="1" placeholder="Digite uma mensagem..." oninput="autoResize(this)" onkeypress="handleEnter(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const token = document.getElementById('hf-token').value.trim();
            const model = document.getElementById('hf-model').value.trim();

            if (!token) {
                alert('Por favor, insira o seu token da Hugging Face na barra lateral.');
                return;
            }

            addMessage(text, 'user');
            userInput.value = '';
            autoResize(userInput);

            const aiMsgContent = addMessage('', 'ai');

            try {
                const response = await fetch(`https://api-inference.huggingface.co/models/${model}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: text,
                        parameters: { max_new_tokens: 500, return_full_text: false }
                    })
                });

                if (!response.ok) {
                    throw new Error(`Erro na API: ${response.statusText}`);
                }

                const data = await response.json();
                let resultText = '';

                if (Array.isArray(data) && data[0]?.generated_text) {
                    resultText = data[0].generated_text;
                } else if (data.generated_text) {
                    resultText = data.generated_text;
                } else {
                    resultText = JSON.stringify(data);
                }

                aiMsgContent.innerHTML = resultText.replace(/\n/g, '<br>');
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                aiMsgContent.innerHTML = `<span style="color: #ff6b6b;">Erro ao conectar com a API: ${error.message}</span>`;
            }
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            const avatarIcon = sender === 'user' 
                ? 'U' 
                : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = text ? text.replace(/\n/g, '<br>') : '<span style="color: var(--text-secondary);">Pensando...</span>';

            msgDiv.innerHTML = `<div class="avatar">${avatarIcon}</div>`;
            msgDiv.appendChild(contentDiv);

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return contentDiv;
        }

        function startNewChat() {
            chatContainer.innerHTML = `
                <div class="message ai">
                    <div class="avatar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                    </div>
                    <div class="message-content">
                        Nova conversa iniciada. Como posso ajudar você hoje?
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
