<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Motor Virtual 2D - Wankel & Pistons</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: #050505;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background: #09090c;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #333;
            width: 280px;
            z-index: 100;
            pointer-events: none;
        }
        h2 { margin: 0 0 10px 0; color: #0077ff; font-size: 15px; text-align: center; }
        .info-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 13px; margin-bottom: 6px; }
        .controls-guide { font-size: 11px; color: #aaa; margin-top: 10px; border-top: 1px solid #333; padding-top: 8px; line-height: 1.4; }
        .highlight { color: #00ff00; }
    </style>
</head>
<body>

    <div id="ui">
        <h2>MOTOR VIRTUAL 2D</h2>
        <div class="info-row"><span>Status:</span> <span id="uiStatus" class="highlight">OFF</span></div>
        <div class="info-row"><span>Modo:</span> <span id="uiMode">Pistão (4 Cil)</span></div>
        <div class="info-row"><span>RPM:</span> <span id="uiRpm">0</span></div>
        <div class="info-row"><span>Velocidade:</span> <span id="uiSpeed">0 km/h</span></div>
        <div class="info-row"><span>Marcha:</span> <span id="uiGear">N</span></div>
        
        <div class="controls-guide">
            <b>Controles:</b><br>
            • <b>SPACE (Segurar):</b> Virar Chave (Ligar)<br>
            • <b>W (Segurar):</b> Acelerador<br>
            • <b>A:</b> Desligar Motor<br>
            • <b>Seta Cima / Baixo:</b> Marchas<br>
            • <b>T:</b> Alternar Wankel / Pistão
        </div>
    </div>

    <canvas id="simulationCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- VARIÁVEIS DE ESTADO ---
        let isWankel = false;
        let engineOn = false;
        let isStarting = false;
        let rpm = 0;
        let kmh = 0;
        let angle = 0;
        let currentGear = 0; // 0 = N, -1 = R, 1-5 = Marchas
        let maxGears = 5;
        let gearRatios = [3.80, 2.40, 1.70, 1.25, 1.00];

        // Teclado
        const keys = { w: false, space: false };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'Space') {
                keys.space = true;
                if (!audioCtx) setupAudio();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                isStarting = true;
            }
            if (e.code === 'KeyA') {
                engineOn = false;
                isStarting = false;
                rpm = 0;
            }
            if (e.code === 'KeyT') {
                isWankel = !isWankel;
                rpm = 0;
                engineOn = false;
                document.getElementById('uiMode').innerText = isWankel ? "Wankel (Rotativo)" : "Pistão (4 Cil)";
            }
            if (e.code === 'ArrowUp') {
                if (currentGear < maxGears) currentGear++;
            }
            if (e.code === 'ArrowDown') {
                if (currentGear > -1) currentGear--;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'Space') {
                keys.space = false;
                isStarting = false;
            }
        });

        // --- ÁUDIO (Web Audio API) ---
        let audioCtx, engineOsc, lowPass, noiseGain;

        function setupAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const mainGain = audioCtx.createGain();
            mainGain.connect(audioCtx.destination);
            mainGain.gain.value = 0.5;

            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            
            lowPass = audioCtx.createBiquadFilter();
            lowPass.type = 'lowpass';
            lowPass.frequency.value = 300;

            engineOsc.connect(lowPass);
            lowPass.connect(mainGain);
            engineOsc.start();
        }

        // --- LOOP PRINCIPAL DE FÍSICA E DESENHO ---
        function update() {
            // Acelerador baseado na tecla W
            let throttleTarget = keys.w ? 8500 : 800;

            if (isStarting) {
                rpm += (600 - rpm) * 0.1;
                if (rpm > 500) engineOn = true;
            } else if (engineOn) {
                if (!keys.w && rpm < 750 && currentGear === 0) {
                    // Mantém marcha lenta se soltar o acelerador em neutro
                    rpm += (800 - rpm) * 0.05;
                } else {
                    let gearRatio = currentGear === 0 ? 0 : gearRatios[currentGear - 1];
                    if (currentGear === 0) {
                        rpm += (throttleTarget - rpm) * 0.08;
                    } else {
                        let targetRpm = (kmh / 3.6) * gearRatio * 300 + (keys.w ? 2000 : 500);
                        kmh += (keys.w ? 0.15 : -0.1) / (gearRatio || 1);
                        if (kmh < 0) kmh = 0;
                        rpm += (targetRpm - rpm) * 0.05;
                    }
                }
                if (rpm > 9000) rpm = 9000;
            } else {
                rpm *= 0.93;
                kmh *= 0.98;
                if (rpm < 10) rpm = 0;
            }

            // Atualiza rotação do motor visual
            let rotSpeed = (rpm / 60) * 0.05;
            angle += rotSpeed;

            // Atualiza Áudio
            if (audioCtx && engineOn && rpm > 50) {
                let freqMultiplier = isWankel ? 1.5 : 0.8;
                engineOsc.frequency.setTargetAtTime((rpm / 60) * freqMultiplier, audioCtx.currentTime, 0.05);
            }

            // Atualiza UI HTML
            document.getElementById('uiStatus').innerText = engineOn ? "LIGADO" : (isStarting ? "PARTIDA..." : "OFF");
            document.getElementById('uiStatus.highlight').style.color = engineOn ? "#00ff00" : "#ffaa00";
            document.getElementById('uiRpm').innerText = Math.round(rpm);
            document.getElementById('uiSpeed').innerText = Math.round(kmh) + " km/h";
            document.getElementById('uiGear').innerText = currentGear === 0 ? "N" : (currentGear === -1 ? "R" : currentGear);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            if (isWankel) {
                drawWankel();
            } else {
                drawPistons();
            }

            ctx.restore();
        }

        // --- RENDERIZADOR DO MOTOR WANKEL 2D ---
        function drawWankel() {
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 4;
            ctx.fillStyle = '#111';

            // Carcaça (Epitrocoide simplificada)
            ctx.beginPath();
            ctx.ellipse(0, 0, 140, 140, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Rotor Triancular Giratório
            ctx.save();
            let rotorAngle = angle / 3; // Relação Wankel 1:3
            ctx.rotate(rotorAngle);

            ctx.fillStyle = '#333';
            ctx.strokeStyle = '#0077ff';
            ctx.lineWidth = 3;

            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
                let a = i * ((Math.PI * 2) / 3);
                let x = Math.cos(a) * 90;
                let y = Math.sin(a) * 90;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.quadraticCurveTo(Math.cos(a - 0.5) * 50, Math.sin(a - 0.5) * 50, x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Centro do Rotor
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Eixo Central
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        // --- RENDERIZADOR DO MOTOR DE PISTÕES 2D (4 Cilindros) ---
        function drawPistons() {
            const numCyl = 4;
            const spacing = 70;
            const startX = -((numCyl - 1) * spacing) / 2;

            for (let i = 0; i < numCyl; i++) {
                let x = startX + (i * spacing);
                let offset = (i * Math.PI) / 2;
                let pistonY = -40 + Math.sin(angle + offset) * 35;

                // Bloco / Cilindro
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 3;
                ctx.strokeRect(x - 22, -110, 44, 90);

                // Pistão
                ctx.fillStyle = '#0077ff';
                ctx.fillRect(x - 20, pistonY, 40, 30);

                // Biela
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(x, pistonY + 15);
                ctx.lineTo(x + 10, 60); // Ligação ao virabrequim simplificada
                ctx.stroke();
            }

            // Virabrequim (Eixo inferior)
            ctx.fillStyle = '#aaa';
            ctx.beginPath();
            ctx.arc(0, 70, 25, 0, Math.PI * 2);
            ctx.fill();
        }

        // --- LOOP PRINCIPAL ---
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
